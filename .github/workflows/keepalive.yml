name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            https://quickstay-5ro8.onrender.com/api/v1/actuator/health) || true
          echo "Health check status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Backend is UP"
          else
            echo "Backend returned '$STATUS' — cold start may take 60-90s, next ping will retry"
          fi
